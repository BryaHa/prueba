    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Leaflet Map Dark Styling */
        .leaflet-container {
            background-color: #0f172a !important;
            font-family: 'Inter', sans-serif;
        }
        .dark-tiles .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }
        .leaflet-popup-content-wrapper {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-radius: 0.75rem !important;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .leaflet-popup-tip {
            background-color: #1e293b !important;
        }

        /* Animated Vehicle Marker Pulsing */
        .vehicle-marker-container {
            transition: all 0.5s linear;
        }
        .pulse-active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.4);
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>

            try {

            } catch (e) {
                map.setView([lat, lng], zoom);
            }
        }

        function safePanTo(lat, lng) {
            if (!map || isNaN(lat) || isNaN(lng)) return;
            try {
                map.panTo([lat, lng], { animate: true, duration: 0.5 });
            } catch (e) {
                map.setView([lat, lng]);
            }
        }

        // Initialize Map
        window.onload = function() {
            initMap();
            renderVehicleList();
            startClock();

            // Handle window resize for Leaflet
            window.addEventListener('resize', () => {
                if (map) map.invalidateSize();
            });

            // Wait for layout rendering to complete before zooming to vehicle
            setTimeout(() => {
                if (map) map.invalidateSize();
                selectVehicle('V-101');
                startSimulationLoop();
            }, 200);
        };

        function initMap() {
            // Center around Hub
            map = L.map('map', {
                center: [BASE_COORDS.lat, BASE_COORDS.lng],
                zoom: 12,
                zoomControl: false
            });

            // Re-add zoom control to bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Dark Mode Tile Layer (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // Draw Geofences
            drawGeofences();

            // Render Vehicles on Map
            FLEET_DATA.forEach(v => {
                const startPos = getInterpolatedPosition(v);
                
                // Draw route line path
                const latLngs = v.path.map(p => [p.lat, p.lng]);
                const polyline = L.polyline(latLngs, {
                    color: v.color,
                    weight: 3,
                    opacity: 0.4,
                    dashArray: '6, 8'
                }).addTo(map);
                routePolylines[v.id] = polyline;

                // Create custom HTML rotated marker
                const customIcon = createVehicleIcon(v, startPos.heading);
                const marker = L.marker([startPos.lat, startPos.lng], { icon: customIcon }).addTo(map);
                
                marker.bindPopup(`
                    <div class="p-1 text-xs">
                        <div class="font-bold text-sm text-cyan-400 mb-1 flex items-center gap-1.5">
                            <i class="fa-solid ${v.icon}"></i> ${v.name} (${v.id})
                        </div>
                        <p class="text-slate-300"><b>Chofer:</b> ${v.driver}</p>
                        <p class="text-slate-300"><b>Velocidad:</b> <span id="popup-speed-${v.id}">${v.speed}</span> km/h</p>
                        <p class="text-slate-300"><b>Batería/Fuel:</b> <span id="popup-fuel-${v.id}">${v.fuel}</span>%</p>
                        <div class="mt-2 pt-2 border-t border-slate-700 flex justify-end">
                            <button onclick="selectVehicle('${v.id}')" class="px-2 py-1 bg-cyan-600 text-white rounded font-medium hover:bg-cyan-500 text-xs">
                                Ver Telemetría
                            </button>
                        </div>
                    </div>
                `);

                marker.on('click', () => {
                    selectVehicle(v.id);
                });

                markers[v.id] = marker;
            });
        }

        function createVehicleIcon(v, heading) {
            const statusBg = v.status === 'en_ruta' ? 'bg-emerald-500' : (v.status === 'alerta' ? 'bg-rose-500 animate-bounce' : 'bg-amber-500');
            const pulseClass = v.status === 'en_ruta' ? 'pulse-active' : '';

            const svgHtml = `
                <div class="relative vehicle-marker-container ${pulseClass}" style="transform: rotate(${heading || 0}deg);">
                    <div class="w-10 h-10 rounded-full bg-slate-900 border-2 border-slate-200 shadow-2xl flex items-center justify-center text-white text-base" style="border-color: ${v.color}; color: ${v.color}">
                        <i class="fa-solid ${v.icon}"></i>
                    </div>
                    <span class="absolute -top-1 -right-1 w-3.5 h-3.5 ${statusBg} border-2 border-slate-900 rounded-full"></span>
                </div>
            `;

            return L.divIcon({
                html: svgHtml,
                className: 'custom-vehicle-pin',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
        }

        function drawGeofences() {
            GEOFENCES.forEach(g => {
                const circle = L.circle([g.lat, g.lng], {
                    color: g.color,
                    fillColor: g.color,
                    fillOpacity: 0.1,
                    radius: g.radius,
                    weight: 1.5,
                    dashArray: '4, 6'
                }).addTo(map);

                circle.bindTooltip(`<b>Geocerca:</b> ${g.name}`, { permanent: false, direction: 'top' });
                geofenceCircles.push(circle);
            });
        }

        function toggleGeofencesVisibility() {
            const checked = document.getElementById('chk-geofences').checked;
            geofenceCircles.forEach(c => {
                if (checked) map.addLayer(c);
                else map.removeLayer(c);
            });
        }

        // Calculate current lat/lng based on vehicle progress along route waypoints safely
        function getInterpolatedPosition(v) {
            if (!v || !v.path || v.path.length < 2) {
                return { lat: BASE_COORDS.lat, lng: BASE_COORDS.lng, heading: 0, currentSegment: 0, p1: { name: 'Hub Central' }, p2: { name: 'Hub Central' } };
            }

            const path = v.path;
            const segments = path.length - 1;
            
            // Normalize progress cleanly between 0 and 1
            let prog = ((v.progress % 1) + 1) % 1;
            const globalProgress = prog * segments;
            const segmentIndex = Math.min(Math.floor(globalProgress), segments - 1);
            const segmentProgress = globalProgress - segmentIndex;

            const p1 = path[segmentIndex] || path[0];
            const p2 = path[(segmentIndex + 1) % path.length] || path[0];

            const lat = p1.lat + (p2.lat - p1.lat) * segmentProgress;
            const lng = p1.lng + (p2.lng - p1.lng) * segmentProgress;

            // Proper Degree-to-Radian conversion for bearing math
            const toRad = deg => deg * Math.PI / 180;
            const lat1 = toRad(p1.lat), lng1 = toRad(p1.lng);
            const lat2 = toRad(p2.lat), lng2 = toRad(p2.lng);
            const dLng = lng2 - lng1;

            const y = Math.sin(dLng) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
            let heading = Math.atan2(y, x) * (180 / Math.PI);
            heading = (heading + 360) % 360;

            if (isNaN(lat) || isNaN(lng)) {
                return { lat: BASE_COORDS.lat, lng: BASE_COORDS.lng, heading: 0, currentSegment: 0, p1, p2 };
            }

            return { lat, lng, heading: isNaN(heading) ? 0 : heading, currentSegment: segmentIndex, p1, p2 };
        }

        // Main Simulation Loop
        function startSimulationLoop() {
            setInterval(() => {
                if (!simulationRunning) return;

                const timeStamp = new Date().toLocaleTimeString();

                FLEET_DATA.forEach(v => {
                    if (v.status === 'detenido') {
                        v.speed = 0;
                    } else {
                        // Advance progress along route
                        const speedFactor = (v.speed / 36000) * simulationSpeed;
                        v.progress += speedFactor;
                        if (v.progress >= 1.0) v.progress = 0.0;

                        // Fuel / Battery consumption
                        if (Math.random() < 0.2) {
                            v.fuel = Math.max(5, parseFloat((v.fuel - 0.1).toFixed(1)));
                        }

                        // Odometer increment
                        v.odometer = parseFloat((parseFloat(v.odometer) + (v.speed / 3600) * simulationSpeed).toFixed(1));

                        // Random small speed fluctuation
                        const delta = (Math.random() - 0.5) * 4;
                        v.speed = Math.min(v.maxSpeed + 15, Math.max(15, Math.round(v.speed + delta)));

                        // Speeding alert trigger logic
                        if (v.speed > v.maxSpeed && v.status !== 'alerta') {
                            v.status = 'alerta';
                            triggerToastAlert(v, `¡Exceso de Velocidad! (${v.speed} km/h - Límite: ${v.maxSpeed} km/h)`);
                        } else if (v.speed <= v.maxSpeed && v.status === 'alerta' && v.fuel > 15) {
                            v.status = 'en_ruta';
                        }
                    }

                    // Get new calculated position
                    const pos = getInterpolatedPosition(v);

                    // Record telemetry history point
                    v.history.push({
                        time: timeStamp,
                        lat: Number(pos.lat.toFixed(5)),
                        lng: Number(pos.lng.toFixed(5)),
                        speed: v.speed,
                        fuel: v.fuel,
                        status: v.status
                    });
                    if (v.history.length > 50) v.history.shift();

                    // Update Leaflet Marker safely
                    if (markers[v.id] && !isNaN(pos.lat) && !isNaN(pos.lng)) {
                        markers[v.id].setLatLng([pos.lat, pos.lng]);
                        markers[v.id].setIcon(createVehicleIcon(v, pos.heading));

                        const popSpeed = document.getElementById(`popup-speed-${v.id}`);
                        const popFuel = document.getElementById(`popup-fuel-${v.id}`);
                        if (popSpeed) popSpeed.innerText = v.speed;
                        if (popFuel) popFuel.innerText = v.fuel;
                    }

                    // If currently selected vehicle, follow map center & update telemetry graph
                    if (selectedVehicleId === v.id) {
                        if (followMode) {
                            safePanTo(pos.lat, pos.lng);
                        }
                        updateTelemetryPanelValues(v, pos);
                        updateChartData(v);
                    }
                });

                // Refresh UI Counters & Sidebar Cards
                updateGlobalStats();
                renderVehicleList();

            }, 1000);
        }

        function updateGlobalStats() {

        function selectVehicle(id) {
            selectedVehicleId = id;
            const v = FLEET_DATA.find(item => item.id === id);
            if (!v) return;

            Object.keys(routePolylines).forEach(key => {
                if (key === id) {
                    routePolylines[key].setStyle({ opacity: 0.9, weight: 5 });
                    routePolylines[key].bringToFront();
                } else {
                    routePolylines[key].setStyle({ opacity: 0.2, weight: 2 });
                }
            });

            // Center map safely on vehicle
            const pos = getInterpolatedPosition(v);
            safeFlyTo(pos.lat, pos.lng, 14);

            const panel = document.getElementById('telemetry-panel');
            panel.classList.remove('translate-y-full');

        function closeTelemetryPanel() {
            document.getElementById('telemetry-panel').classList.add('translate-y-full');

        // Chart.js Telemetry Graph
        function initChart() {
            const ctx = document.getElementById('speedChart');
            if (!ctx) return;

            if (chartInstance) {
                chartInstance.destroy();
            }

            const currentV = FLEET_DATA.find(v => v.id === selectedVehicleId);
            const labels = currentV ? currentV.history.map(h => h.time) : [];
            const speeds = currentV ? currentV.history.map(h => h.speed) : [];

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Histórico Velocidad (km/h)',
                        data: speeds,
                        borderColor: '#0284c7',
                        backgroundColor: 'rgba(2, 132, 199, 0.15)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            min: 0,
                            max: 100,
                            ticks: { color: '#64748b', font: { size: 10 } },
                            grid: { color: '#334155' }
                        }
                    }
                }
            });
        }

        function updateChartData(v) {
            if (!chartInstance) return;
            chartInstance.data.labels = v.history.map(h => h.time);
            chartInstance.data.datasets[0].data = v.history.map(h => h.speed);
            chartInstance.update('none'); // smooth updates without reset
        }

        // Audio & Toast Alert System
        function playAlertSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz A5 note
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {
                console.log("Audio not allowed yet");
            }
        }

        function triggerToastAlert(v, message) {
            playAlertSound();

            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800/95 border-l-4 border-rose-500 text-slate-100 p-3.5 rounded-xl shadow-2xl flex items-start space-x-3 transition transform translate-y-2 duration-300 border border-slate-700 pointer-events-auto';

            toast.innerHTML = `
                <div class="text-rose-400 text-lg pt-0.5">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="flex-1">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-xs text-rose-400">${v.name} (${v.id})</span>
                        <span class="text-[10px] text-slate-400">${new Date().toLocaleTimeString()}</span>
                    </div>
                    <p class="text-xs text-slate-200 mt-0.5 font-medium">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-white text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            toastContainer.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 6000);
        }

        function toggleSound() {

        function setSimSpeed(speed) {
            simulationSpeed = speed;
            [1, 2, 5].forEach(s => {
                const btn = document.getElementById(`speed-${s}`);
                if (s === speed) {
                    btn.className = 'px-2 py-1 bg-cyan-600 text-white text-xs rounded-md font-mono font-bold transition';
                } else {
                    btn.className = 'px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-md font-mono transition';
                }
            });
        }

        function triggerRandomIncident() {
            const randomIndex = Math.floor(Math.random() * FLEET_DATA.length);
            const v = FLEET_DATA[randomIndex];
            
            v.speed = v.maxSpeed + 25;
            v.status = 'alerta';
            triggerToastAlert(v, `¡Alerta de Telemetría! Freno intempestivo y exceso de velocidad (${v.speed} km/h).`);
            selectVehicle(v.id);
        }

        function setFilter(filter) {
            activeFilter = filter;
            ['all', 'en_ruta', 'detenido', 'alerta'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'flex-1 py-1 px-2 rounded-lg bg-cyan-600 text-white font-medium transition text-center';
                } else {
                    btn.className = 'flex-1 py-1 px-2 rounded-lg bg-slate-900 text-slate-400 hover:bg-slate-700 transition text-center';
                }
            });
            renderVehicleList();
        }

        function filterVehicles() {
            renderVehicleList();
        }

        function toggleFollowMode() {
            followMode = !followMode;
            const btn = document.getElementById('btn-follow');
            btn.className = followMode 
                ? 'p-2.5 bg-cyan-600 text-white rounded-xl border border-cyan-500 shadow-xl transition flex items-center justify-center'
                : 'p-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-400 rounded-xl border border-slate-700 shadow-xl transition flex items-center justify-center';
        }

        function fitMapToFleet() {
            const group = new L.featureGroup(Object.values(markers));
            map.fitBounds(group.getBounds().pad(0.2));
        }

        function resetAllRoutes() {
            FLEET_DATA.forEach(v => {
                v.progress = 0.0;
                v.history = [];
                v.status = 'en_ruta';
                v.fuel = 95;
            });
            renderVehicleList();
            fitMapToFleet();
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleMapTheme() {
            currentMapTheme = currentMapTheme === 'dark' ? 'light' : 'dark';
            const container = map.getContainer();
            if (currentMapTheme === 'light') {
                container.classList.remove('dark-tiles');
            } else {
                container.classList.add('dark-tiles');
            }
        }

        function startClock() {
            setInterval(() => {
                document.getElementById('clock-display').innerText = new Date().toLocaleTimeString();
            }, 1000);
        }

        // Route History Modal & CSV Export
        function openHistoryModal(id) {
            const v = FLEET_DATA.find(item => item.id === id);
            if (!v) return;

            document.getElementById('modal-vehicle-title').innerText = `${v.name} (${v.id})`;
            document.getElementById('modal-driver-info').innerText = `Conductor: ${v.driver} | Placa: ${v.plate}`;

            const tbody = document.getElementById('history-table-body');
            if (v.history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">Sin registros de telemetría aún...</td></tr>`;
            } else {
                tbody.innerHTML = v.history.map(h => `
                    <tr class="hover:bg-slate-700/30 font-mono">
                        <td class="p-2.5 text-slate-200">${h.time}</td>
                        <td class="p-2.5">${h.lat}</td>
                        <td class="p-2.5">${h.lng}</td>
                        <td class="p-2.5 font-bold ${h.speed > v.maxSpeed ? 'text-rose-400' : 'text-emerald-400'}">${h.speed} km/h</td>
                        <td class="p-2.5">${h.fuel}%</td>
                        <td class="p-2.5">
                            <span class="px-2 py-0.5 rounded text-[10px] ${h.status === 'alerta' ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}">
                                ${h.status}
                            </span>
                        </td>
                    </tr>
                `).join('');
            }

            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function downloadCSVReport() {
            const v = FLEET_DATA.find(item => item.id === selectedVehicleId);
            if (!v || !v.history.length) return;

            let csvContent = "data:text/csv;charset=utf-8,Hora,Latitud,Longitud,Velocidad(km/h),Combustible(%),Estado\n";
            v.history.forEach(h => {
                csvContent += `${h.time},${h.lat},${h.lng},${h.speed},${h.fuel},${h.status}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Reporte_Telemetria_${v.id}_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
